[project]
name = "trading-research-mcp"
version = "0.2.0"
description = "Experiment authoring and local tools for the frozen Gaps research study"
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=1.28,<2", "trading-research"]

[project.scripts]
trading-research-mcp = "trading_research_mcp.server:main"

[tool.uv.sources]
trading-research = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
