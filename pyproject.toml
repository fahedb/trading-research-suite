[project]
name = "trading-research"
version = "0.1.0"
description = "Extensible quantitative research platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.9",
    "scikit-learn>=1.7,<1.9",
]

[project.scripts]
trading-research = "trading_research.ops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "PT",        # pytest style
    "SIM",       # simplify
    "TC",        # type-checking blocks
    "RUF",       # ruff-specific
    "ANN",       # annotations required
    "D",         # docstrings
]
ignore = [
    "D107",      # __init__ docstring (documented at class level)
    "D203",      # incompatible with D211
    "D213",      # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false      # Mapping[str, Any] metadata is deliberate
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not performance'"
markers = [
    "performance: explicit Phase 1 through Phase 6 performance qualification tests",
]
