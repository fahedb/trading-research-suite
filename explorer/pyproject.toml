[project]
name = "trading-research-explorer"
version = "0.1.0"
description = "Read-only Trade Explorer for the Quant Research Machine (sibling project)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "trading-research",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # Executes prototype/app.js time formatters in tests. No browser on this VM,
    # so this is how the timezone-invariance rule is actually verified.
    "quickjs>=1.19",
    # TestClient needs an HTTP client; used only in tests.
    "httpx2",
]

[tool.uv.sources]
trading-research = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
